name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        deps: [prefer-lowest, prefer-stable]

    name: PHP ${{ matrix.php }} · ${{ matrix.deps }}

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # Laravel 13.0, the prefer-lowest floor, has advisories; only advisory blocking is turned off.
      - run: composer update --${{ matrix.deps }} --prefer-dist --no-interaction --no-progress
        env:
          COMPOSER_POLICY_ADVISORIES_BLOCK: ${{ matrix.deps == 'prefer-lowest' && '0' || '1' }}

      - run: composer ${{ matrix.php == '8.5' && matrix.deps == 'prefer-stable' && 'check' || 'test' }}
